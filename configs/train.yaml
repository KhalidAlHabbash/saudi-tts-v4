# Local full-model adaptation contract. Only ./scripts/train.sh starts the real run.
upstream:
  f5_tts_version: "1.1.7"
  f5_tts_revision: "c96c3aeed84f5e02aa54dc42c1193537ead39837"
  silma_repo: silma-ai/silma-tts
  silma_revision: "ac81834c5ce305504fe4c7602187042fdd6913db"
  silma_dir: models/base/silma-tts-v1-ac81834c
  checkpoint: models/base/silma-tts-v1-ac81834c/model.pt
  model_config: models/base/silma-tts-v1-ac81834c/config.yaml
  vocab: models/base/silma-tts-v1-ac81834c/vocab.txt
  pretrained_weights: ema
  vocos_repo: charactr/vocos-mel-24khz
  vocos_revision: "0feb3fdd929bcd6649e0e7c5a688cf7dd012ef21"
  vocos_dir: models/base/vocos-mel-24khz-0feb3fdd

data:
  train_manifest: data/splits/train.jsonl
  validation_manifest: data/splits/validation.jsonl
  test_manifest: data/splits/test.jsonl
  min_duration_seconds: 1.0
  max_duration_seconds: 8.0
  max_text_characters: 600
  strict_vocabulary: true
  # 8 seconds at 24 kHz / hop 256 = 750 frames. max_samples keeps batch 1.
  frames_per_batch: 750
  max_samples_per_batch: 1
  num_workers: 0

model:
  name: SilmaTTS_V1_Small
  backbone: DiT
  architecture:
    dim: 768
    depth: 18
    heads: 12
    ff_mult: 2
    text_dim: 512
    text_mask_padding: true
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: true
  mel:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos

optimization:
  seed: 20260911
  epochs: 25
  max_updates: 120000
  stage_targets: [13122, 26144, 52188, 104276, 120000]
  stage_stop_update: 120000
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_updates: 2000
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  mixed_precision: "no"
  freeze: none

validation:
  every_updates: 250
  max_batches: 16
  seed: 20260912

checkpointing:
  output_dir: checkpoints/silma-saudi
  save_every_updates: 500
  save_last_every_updates: 100
  keep_last_n: 3
  resume: auto

logging:
  log_every_updates: 10
  jsonl: runs/silma-saudi/metrics.jsonl

runtime:
  device_preference: mps_then_cpu
  allow_cpu_fallback: true
  fp32: true
  pin_memory: false
  deterministic: true
  allow_tf32: false
  minimum_free_disk_gib: 20

smoke:
  manifest_rows: 4
  one_step_max_duration_seconds: 2.0
  output_dir: checkpoints/smoke
  metric_jsonl: runs/smoke/metrics.jsonl
